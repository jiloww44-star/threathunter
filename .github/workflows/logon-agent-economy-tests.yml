name: LOG_ON Agent Economy Control Tests

on:
  push:
    paths:
      - "logon-agent-economy/**"
      - ".github/workflows/logon-agent-economy-tests.yml"
  pull_request:
    paths:
      - "logon-agent-economy/**"
      - ".github/workflows/logon-agent-economy-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run control-plane tests
        run: python logon-agent-economy/tests/test_gateway.py
